dataset: twitter15
num_classes: 4
labels: [non-rumor, true, false, unverified]
model: tegfnd
model_name: microsoft/deberta-v3-base
max_len: 192
batch_size: 8
grad_accum_steps: 2
backbone_lr: 1.0e-5
head_lr: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.1
label_smoothing: 0.1
use_class_weights: true
freeze_layers: 4
epochs: 15
patience: 5
seed: 42
