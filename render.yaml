services:
  - type: web
    name: rumour-desk
    runtime: python
    plan: free
    branch: claude/affectionate-ramanujan-4cecko
    buildCommand: pip install -r requirements-backend.txt && python -m backend.warmup
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
